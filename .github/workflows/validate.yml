name: Application validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Application and Worker dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0

      - name: Validate syntax, production build, and smoke tests
        run: npm run validate:app

      - name: Validate CodeQL workflow configuration
        run: npm run validate:codeql

      - name: Prepare Cloudflare Worker deployment package
        run: npx --yes wrangler@4.118.0 deploy --dry-run --outdir .wrangler/validate-deploy

      - name: Verify generated production metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/company.html
          test -f public/build.json
          node -e "const b=require('./public/build.json'); if(!Number.isInteger(b.productionBundle)) throw new Error('Missing productionBundle in public/build.json'); console.log('Validated production bundle', b.productionBundle)"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: still-validation-${{ github.sha }}
          path: |
            public/build.json
            .wrangler/validate-deploy
          if-no-files-found: warn
          retention-days: 7
