name: Application validation

on:
  push:
    branches:
      - main
      - infrastructure/production-ci
      - infrastructure/operations-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Application and Worker dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0

      - name: Validate syntax, production build, and smoke tests
        run: npm run validate:app

      - name: Validate CodeQL workflow configuration
        run: npm run validate:codeql

      - name: Verify active Worker architecture
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -f scripts/validate-active-worker.js
          test -f wrangler.jsonc

          node scripts/validate-active-worker.js

      - name: Prepare Cloudflare Worker deployment package
        run: npx --yes wrangler@4.118.0 deploy --dry-run --outdir .wrangler/validate-deploy

      - name: Verify production metadata
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/company.html
          test -f public/build.json
          node scripts/validate-active-worker.js

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: still-validation-${{ github.sha }}
          path: |
            public/build.json
            .wrangler/validate-deploy
          if-no-files-found: error
          retention-days: 7
