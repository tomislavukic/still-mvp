name: Create versioned release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-versioned-release
  cancel-in-progress: false

jobs:
  validate-and-release:
    name: Validate and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases must be created from main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate application
        run: npm run validate:app

      - name: Validate CodeQL configuration
        run: npm run validate:codeql

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Validate Cloudflare package
        run: |
          rm -rf .wrangler/release-validation

          npx --yes wrangler@4.118.0 deploy \
            --dry-run \
            --outdir .wrangler/release-validation

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid semantic version in package.json: $VERSION"
            exit 1
          fi

          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin \
            "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists."
            echo "Increase package.json version before creating another release."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Release version: ${VERSION}"
          echo "Release tag: ${TAG}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          notes_file="docs/releases/v${RELEASE_VERSION}.md"
          notes_args=(--generate-notes)

          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Still ${RELEASE_TAG} · Everything you own" \
            "${notes_args[@]}"

          echo "Published Still ${RELEASE_VERSION}"
