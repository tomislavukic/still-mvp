<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Still? Merchant Operations</title><style>:root{color-scheme:dark;--bg:#04100b;--card:#08150f;--card2:#0c1b13;--line:#1c3b2b;--ink:#edf7f1;--muted:#8fa79a;--green:#54dc91;--amber:#f2c96d;--red:#ff827a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#0d2619 0,transparent 35%),var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.wrap{max-width:1280px;margin:auto;padding:56px 28px 100px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--green);font-weight:800}h1{font-size:44px;letter-spacing:-2px;margin:8px 0}p{color:var(--muted);line-height:1.55}.auth{display:flex;gap:8px}.auth input,.filters input,.filters select,textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:12px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:#07110c}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:28px 0}.stat,.panel,.company{border:1px solid var(--line);background:rgba(8,21,15,.88);border-radius:18px}.stat{padding:18px}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:12px}.filters{display:flex;gap:10px;margin:18px 0}.filters input{flex:1}.company{margin:12px 0;overflow:hidden}.company summary{list-style:none;display:grid;grid-template-columns:1.6fr .8fr .8fr auto;gap:12px;align-items:center;padding:18px;cursor:pointer}.company summary::-webkit-details-marker{display:none}.company h3{margin:0 0 5px;font-size:18px}.small{font-size:12px;color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px}.pill.approved,.pill.verified{color:var(--green)}.pill.rejected{color:var(--red)}.pill.submitted,.pill.under_review{color:var(--amber)}.body{border-top:1px solid var(--line);padding:18px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.panel{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{padding:10px;background:var(--card2);border-radius:10px}.field span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}.review textarea{width:100%;min-height:90px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.approve{background:var(--green)}.changes{background:var(--amber)}.reject{background:var(--red)}.timeline{max-height:280px;overflow:auto}.event{padding:10px 0;border-bottom:1px solid var(--line)}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:800px){header,.auth,.filters{display:block}.auth>* ,.filters>*{width:100%;margin:5px 0}.stats{grid-template-columns:1fr 1fr}.company summary{grid-template-columns:1fr}.body{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><div><div class="eyebrow">STILL? OPERATIONS</div><h1>Merchant Review Center</h1><p>Company verification, retailer ownership and review history in one protected workspace.</p></div><div class="auth"><input id="token" type="password" placeholder="Verification admin token" autocomplete="current-password"><button id="open">Open review center</button></div></header><section id="app"><div class="empty">Enter the admin token to load merchant operations.</div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token='',data=null;async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+token,...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{data:j,status:r.status});return j}const pill=s=>`<span class="pill ${esc(s||'')}">${esc((s||'awaiting submission').replaceAll('_',' '))}</span>`;function stats(s){return `<div class="stats"><div class="stat"><b>${s.organizations||0}</b><span>Companies</span></div><div class="stat"><b>${s.verification_pending||0}</b><span>Verification queue</span></div><div class="stat"><b>${s.needs_changes||0}</b><span>Needs changes</span></div><div class="stat"><b>${s.claim_pending||0}</b><span>Retailer claims</span></div><div class="stat"><b>${s.verified||0}</b><span>Verified</span></div></div>`}function company(o){const vs=o.verification_status||'awaiting_submission';return `<details class="company" data-org="${esc(o.id)}"><summary><div><h3>${esc(o.name)}</h3><div class="small">${esc(o.owner_email||'No owner email')} · ${esc((o.country_code||'').toUpperCase())}</div></div><div>${pill(vs)}</div><div>${o.claim_id?pill(o.claim_status):'<span class="small">No retailer claim</span>'}</div><b>Review →</b></summary><div class="body"><div><section class="panel"><h3>Company verification</h3><div class="grid"><div class="field"><span>Legal name</span>${esc(o.legal_name||'Not submitted')}</div><div class="field"><span>Registration number</span>${esc(o.registration_number||'—')}</div><div class="field"><span>VAT / tax ID</span>${esc(o.vat_id||'—')}</div><div class="field"><span>Website</span>${esc(o.verification_website||o.website_url||'—')}</div><div class="field"><span>Support email</span>${esc(o.verification_email||o.support_email||'—')}</div><div class="field"><span>Domain evidence</span>${esc(o.website_domain||'—')} / ${esc(o.email_domain||'—')}</div></div>${o.verification_review_note?`<p><b>Previous note:</b> ${esc(o.verification_review_note)}</p>`:''}${o.verification_id?`<div class="review"><textarea id="note-v-${esc(o.verification_id)}" placeholder="Reviewer note. Required when requesting changes or rejecting."></textarea><div class="actions"><button class="approve" onclick="reviewVerification('${esc(o.verification_id)}','approved')">Approve company</button><button class="changes" onclick="reviewVerification('${esc(o.verification_id)}','needs_changes')">Request changes</button><button class="reject" onclick="reviewVerification('${esc(o.verification_id)}','rejected')">Reject</button></div></div>`:'<p>No verification submission yet. The company remains visible here so registrations do not disappear from operations.</p>'}</section>${o.claim_id?`<section class="panel" style="margin-top:14px"><h3>Retailer profile claim</h3><div class="grid"><div class="field"><span>Retailer</span>${esc(o.retailer_name)}</div><div class="field"><span>Retailer key</span>${esc(o.claimed_retailer_key)}</div><div class="field"><span>Official URL</span>${esc(o.claim_official_url||'—')}</div><div class="field"><span>Status</span>${pill(o.claim_status)}</div></div><div class="review"><textarea id="note-c-${esc(o.claim_id)}" placeholder="Reviewer note"></textarea><div class="actions"><button class="approve" onclick="reviewClaim('${esc(o.claim_id)}','approved')">Approve retailer claim</button><button class="changes" onclick="reviewClaim('${esc(o.claim_id)}','needs_changes')">Request changes</button><button class="reject" onclick="reviewClaim('${esc(o.claim_id)}','rejected')">Reject</button></div></div></section>`:''}</div><aside class="panel"><h3>Audit history</h3><div class="timeline" id="events-${esc(o.id)}"><span class="small">Open company to load history…</span></div></aside></div></details>`}function render(){const a=$('#app');a.innerHTML=stats(data.stats)+`<div class="filters"><input id="q" placeholder="Search company, owner email, VAT, registration or retailer…"><select id="status"><option value="">All companies</option><option value="pending">Pending verification</option><option value="awaiting_submission">Awaiting submission</option><option value="needs_changes">Needs changes</option><option value="verified">Verified</option><option value="rejected">Rejected</option><option value="claim_review">Retailer claim review</option></select></div><div>${data.organizations.length?data.organizations.map(company).join(''):'<div class="empty">No companies match this filter.</div>'}</div>`;$('#q').oninput=debounce(load,250);$('#status').onchange=load;document.querySelectorAll('details.company').forEach(d=>d.ontoggle=()=>{if(d.open)events(d.dataset.org)})}async function load(){try{const q=$('#q')?.value||'',s=$('#status')?.value||'';data=await api('/api/v1/admin/overview?q='+encodeURIComponent(q)+'&status='+encodeURIComponent(s));render()}catch(e){$('#app').innerHTML=`<div class="empty">${e.status===401?'Invalid admin token.':e.data?.error==='admin_not_configured'?'VERIFICATION_ADMIN_TOKEN is not configured at runtime.':'Could not load merchant operations: '+esc(e.message)}</div>`}}async function events(org){try{const r=await api('/api/v1/admin/organizations/'+encodeURIComponent(org)+'/events'),h=document.getElementById('events-'+org);h.innerHTML=r.events.length?r.events.map(e=>`<div class="event"><b>${esc(e.event_type.replaceAll('_',' '))}</b><div class="small">${esc(e.from_status||'—')} → ${esc(e.to_status||'—')} · ${new Date(e.created_at).toLocaleString()}</div>${e.review_note?`<p>${esc(e.review_note)}</p>`:''}</div>`).join(''):'<span class="small">No review actions recorded yet.</span>'}catch{}}async function reviewVerification(id,decision){const note=document.getElementById('note-v-'+id).value.trim();if(decision!=='approved'&&!note)return alert('Add a reviewer note before requesting changes or rejecting.');if(!confirm(`Confirm ${decision.replaceAll('_',' ')}?`))return;try{await api('/api/v1/admin/verifications/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({decision,note})});await load()}catch(e){alert('Review failed: '+(e.data?.error||e.message))}}async function reviewClaim(id,decision){const note=document.getElementById('note-c-'+id).value.trim();if(decision!=='approved'&&!note)return alert('Add a reviewer note before requesting changes or rejecting.');if(!confirm(`Confirm ${decision.replaceAll('_',' ')}?`))return;try{await api('/api/v1/admin/retailer-claims/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({decision,note})});await load()}catch(e){alert(e.data?.error==='retailer_already_claimed'?'That retailer is already owned by another company.':e.data?.error==='company_not_verified'?'Verify the company before approving its retailer claim.':'Claim review failed: '+(e.data?.error||e.message))}}function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}$('#open').onclick=()=>{token=$('#token').value.trim();load()};$('#token').onkeydown=e=>{if(e.key==='Enter')$('#open').click()};</script></body></html>
