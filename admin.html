nd:rgba(8,21,15,.92);border-radius:20px}.stat{padding:20px;cursor:pointer;min-height:112px}.stat:hover{border-color:var(--line2)}.stat b{display:block;font-size:36px;line-height:1}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:10px}.workflow{margin:16px 0 24px;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(14,39,25,.88),rgba(7,19,13,.92))}.workflow-head{display:flex;justify-content:space-between;gap:24px;align-items:center}.workflow h3{margin:0 0 4px;font-size:21px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.flow-step{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(4,16,11,.62);min-height:88px}.flow-step b{display:block;font-size:14px}.flow-step span{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:5px}.flow-step.active{border-color:var(--green);box-shadow:inset 0 0 0 1px rgba(84,220,145,.12)}.attention{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin:0 0 20px}.next-card{padding:21px}.next-card h3{margin:5px 0 7px;font-size:20px}.filters{display:flex;gap:12px;margin:18px 0}.filters input{flex:1}
.organization-center{margin-top:26px}
.organization-center-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}
.organization-center-head h2{margin:4px 0 0;font-size:30px}
.organization-center-head p{max-width:760px;margin-bottom:0}
.organization-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.organization-summary-card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.organization-summary-card.healthy{border-color:rgba(99,230,155,.34)}
.organization-summary-card.warning{border-color:rgba(244,213,122,.48)}
.organization-summary-card b{display:block;font-size:30px;line-height:1}
.organization-summary-card span{display:block;margin-top:9px;font-weight:800}
.organization-summary-card small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}
.organization-toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.32fr);gap:10px;margin-bottom:14px}
.organization-toolbar input,.organization-toolbar select{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 15px;font:inherit;min-height:48px}
.organization-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.organization-card{border:1px solid var(--line);border-radius:18px;background:rgba(8,21,15,.92);overflow:hidden}
.organization-open{display:block;width:100%;padding:20px;background:transparent;color:inherit;text-align:left;border-radius:0}
.organization-open:hover{transform:none;background:rgba(255,255,255,.018)}
.organization-card-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center}
.organization-avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--card3);border:1px solid var(--line2);font-size:18px;font-weight:900;color:var(--green)}
.organization-identity{min-width:0}
.organization-identity h3{margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.organization-identity span{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.organization-stage{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;white-space:nowrap}
.organization-stage.healthy{color:var(--green);border-color:rgba(99,230,155,.4)}
.organization-stage.warning{color:var(--amber);border-color:rgba(244,213,122,.45)}
.organization-stage.failure{color:var(--red);border-color:rgba(255,145,138,.5)}
.organization-stage.neutral{color:var(--muted)}
.organization-progress{height:5px;margin:17px 0;background:var(--card2);border-radius:999px;overflow:hidden}
.organization-progress>div{height:100%;background:var(--green);border-radius:inherit}
.organization-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.organization-meta-grid>div{padding:11px;border-radius:11px;background:var(--card2);min-width:0}
.organization-meta-grid span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.organization-meta-grid strong{display:block;margin-top:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.organization-signals{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.organization-signals span{display:inline-flex;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px}
.organization-signals span.healthy{color:var(--green)}
.organization-signals span.warning{color:var(--amber)}
.organization-signals span.failure{color:var(--red)}
.organization-open-label{margin-top:15px;color:var(--green);font-size:12px;font-weight:800}
.organization-drawer-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.54);backdrop-filter:blur(4px)}
.organization-drawer{position:fixed;z-index:90;top:0;right:0;width:min(620px,94vw);height:100vh;background:#06110c;border-left:1px solid var(--line);box-shadow:-24px 0 80px rgba(0,0,0,.46);overflow:auto;transform:translateX(102%);transition:transform .22s ease}
.organization-drawer.open{transform:translateX(0)}
.drawer-open{overflow:hidden}

.organization-drawer-shell.workspace{min-height:100%;padding:0}
.organization-drawer-shell.workspace .organization-drawer-header{padding:26px 28px 20px}
.organization-workspace-title{display:flex;align-items:center;gap:14px;min-width:0}
.organization-avatar.large{width:52px;height:52px;flex:0 0 52px;font-size:21px}
.organization-workspace-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.organization-workspace-tabs{position:sticky;top:0;z-index:4;display:flex;gap:5px;padding:10px 28px;border-bottom:1px solid var(--line);background:rgba(6,17,12,.96);backdrop-filter:blur(16px);overflow:auto}
.organization-workspace-tabs button{flex:0 0 auto;min-height:40px;padding:9px 13px;border-radius:10px;background:transparent;color:var(--muted);border:1px solid transparent}
.organization-workspace-tabs button:hover{transform:none;background:var(--card2);color:var(--ink)}
.organization-workspace-tabs button.active{background:var(--card3);color:var(--ink);border-color:var(--line2)}
.organization-tab-panel{padding:0 28px 34px}
.organization-overview-hero{padding:24px 0 10px}
.organization-readiness{display:flex;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.organization-readiness.healthy{border-color:rgba(99,230,155,.38)}
.organization-readiness.warning{border-color:rgba(244,213,122,.46)}
.organization-readiness-ring{--readiness:0;display:grid;place-items:center;flex:0 0 92px;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--readiness)*1%),var(--card3) 0);position:relative}
.organization-readiness-ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
.organization-readiness-ring strong{position:relative;z-index:1;font-size:21px}
.organization-readiness h3{margin:4px 0 4px}
.organization-readiness p{margin:0}
.organization-workspace-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.organization-workspace-card{padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.organization-workspace-card h3{margin:4px 0 6px}
.organization-workspace-card p{margin-bottom:0}
.organization-workspace-section{padding:22px 0;border-top:1px solid var(--line)}
.organization-workspace-section.first{border-top:0;padding-top:24px}
.organization-section-count{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.organization-checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.organization-checklist>div{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.organization-checklist>div.complete{border-color:rgba(99,230,155,.28)}
.organization-checklist>div.incomplete{color:var(--muted)}
.organization-check-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--card3);font-weight:900}
.organization-checklist .complete .organization-check-icon{color:var(--green)}
.organization-detail-grid.large{grid-template-columns:1fr 1fr}
.organization-timeline{position:relative;display:grid;gap:0;margin-top:18px}
.organization-timeline-item{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;position:relative;padding-bottom:22px}
.organization-timeline-item:not(:last-child):before{content:"";position:absolute;left:17px;top:34px;bottom:0;width:1px;background:var(--line)}
.organization-timeline-marker{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:900}
.organization-timeline-item.complete .organization-timeline-marker{color:var(--green);border-color:rgba(99,230,155,.42)}
.organization-timeline-item.current .organization-timeline-marker{box-shadow:0 0 0 4px rgba(99,230,155,.08)}
.organization-timeline-item strong,.organization-timeline-item span{display:block}
.organization-timeline-item span{margin-top:4px;color:var(--muted);font-size:12px}
.organization-safety-note{display:grid;gap:4px;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.organization-safety-note span{color:var(--muted);font-size:12px;line-height:1.5}
.organization-drawer-shell{padding:28px}
.organization-drawer-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.organization-drawer-header h2{margin:4px 0 0;font-size:30px}
.organization-drawer-header p{margin-bottom:0}
.organization-drawer-status{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 0;color:var(--muted);font-size:12px}
.organization-drawer-section{padding:20px 0;border-top:1px solid var(--line)}
.organization-drawer-section:first-of-type{border-top:0}
.organization-drawer-section h3{margin:3px 0 8px}
.organization-section-heading{display:flex;justify-content:space-between;align-items:center;gap:14px}
.compact{min-height:38px;padding:8px 12px;font-size:12px}
.organization-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.organization-detail-grid>div{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.organization-detail-grid span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.organization-detail-grid strong{display:block;margin-top:5px;font-size:13px;word-break:break-word}
.organization-drawer-signals{display:grid;gap:8px;margin-top:12px}
.organization-drawer-signals>div{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.organization-drawer-signals .healthy{color:var(--green)}
.organization-drawer-signals .warning{color:var(--amber)}
.organization-drawer-signals .failure{color:var(--red)}
.organization-platform-actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.button-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:12px;background:var(--ink);color:#07110c;text-decoration:none;font-weight:800}
.company{margin:14px 0;overflow:hidden}.company summary{list-style:none;display:grid;grid-template-columns:1.7fr .95fr .95fr auto;gap:16px;align-items:center;padding:22px;cursor:pointer}.company summary::-webkit-details-marker{display:none}.company summary:hover{background:rgba(255,255,255,.02)}.company h3{margin:0 0 6px;font-size:21px}.small{font-size:13px;color:var(--muted);line-height:1.5}.pill{display:inline-flex;padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;line-height:1.1}.pill.approved,.pill.verified{color:var(--green)}.pill.rejected{color:var(--red)}.pill.submitted,.pill.under_review{color:var(--amber)}.body{border-top:1px solid var(--line);padding:20px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.panel{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:14px;background:var(--card2);border-radius:12px;min-height:74px;word-break:break-word}.field span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}.progress div{padding:12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);min-height:74px}.progress div.done{border-color:rgba(84,220,145,.45)}.progress div.current{border-color:var(--green);background:var(--card3)}.progress b{display:block;font-size:12px}.progress span{font-size:11px;color:var(--muted)}.notice{padding:15px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin:14px 0}.notice strong{display:block;margin-bottom:5px;font-size:15px}.review textarea{width:100%;min-height:110px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.approve{background:var(--green)}.changes{background:var(--amber)}.reject{background:var(--red)}.timeline{max-height:360px;overflow:auto}.event{padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:15px}.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:8px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}.section-title h2{margin:0}.count{font-size:13px;color:var(--muted)}


.incident-center{display:flex;gap:16px;align-items:flex-start;margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
.incident-center.operational{border-color:rgba(99,230,155,.4)}
.incident-center.warning{border-color:rgba(244,213,122,.55)}
.incident-center.critical{border-color:rgba(255,145,138,.65)}
.incident-icon{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border-radius:50%;font-size:19px;font-weight:900;background:var(--card)}
.incident-center.operational .incident-icon{color:var(--green)}
.incident-center.warning .incident-icon{color:var(--amber)}
.incident-center.critical .incident-icon{color:var(--red)}
.incident-content{min-width:0;flex:1}
.incident-content h3{margin:4px 0 5px}
.incident-content>p{margin:0;color:var(--muted)}
.incident-list{display:grid;gap:8px;margin-top:12px}
.incident-item{position:relative;padding:12px 105px 12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.incident-item strong,.incident-item span{display:block}
.incident-item span{margin-top:4px;color:var(--muted);font-size:12px}
.incident-item code{position:absolute;right:12px;top:12px;color:var(--muted);font-size:10px}
.incident-item.warning{border-color:rgba(244,213,122,.4)}
.incident-item.critical{border-color:rgba(255,145,138,.5)}
.operations-dashboard{margin:0 0 18px;padding:22px}
.operations-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.operations-head h2{margin:4px 0 0}
.operations-head p{margin-bottom:0}
.operations-loading{display:flex;align-items:center;gap:10px;padding:34px 4px;color:var(--muted)}
.health-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 18px rgba(99,230,155,.7)}
.health-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.health-card{padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
.health-card b{display:block;font-size:23px;line-height:1.15}
.health-card span{display:block;margin-top:7px;font-weight:750}
.health-card small{display:block;margin-top:4px;color:var(--muted)}
.health-card.healthy{border-color:rgba(99,230,155,.4)}
.health-card.warning{border-color:rgba(244,213,122,.5)}
.health-card.failure{border-color:rgba(255,145,138,.55)}
.health-footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.health-footer>div{padding:14px;border-radius:12px;background:var(--card2)}
.health-footer strong,.health-footer span{display:block}
.health-footer span{color:var(--muted);font-size:12px;margin-top:4px}

.activity-groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.activity-group{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--card2)}
.activity-group-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--line)}
.activity-group-head h4{margin:0}
.activity-group-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.activity-group-head>span{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}
.health-events{margin-top:18px}
.health-events h3{margin-bottom:6px}
.health-event{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line)}
.health-event:last-child{border-bottom:0}
.health-event strong,.health-event span{display:block}
.health-event span,.health-event time{color:var(--muted);font-size:12px}
.audit-console{margin:0 0 26px;padding:22px}
.audit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.audit-head h2{margin:4px 0 0}
.audit-head p{margin-bottom:0}
.secondary{background:var(--card3);color:var(--ink);border:1px solid var(--line)}
.audit-filters{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;margin:20px 0}
.audit-filters input{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 15px;font:inherit;min-height:48px}
.audit-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
.audit-table{width:100%;border-collapse:collapse;min-width:900px}
.audit-table th,.audit-table td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.audit-table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--card2)}
.audit-table td{font-size:13px}
.audit-table tbody tr:last-child td{border-bottom:0}
.audit-sub{display:block;color:var(--muted);font-size:11px;margin-top:4px;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.audit-outcome{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px}
.audit-outcome.success{color:var(--green)}
.audit-outcome.warning{color:var(--amber)}
.audit-outcome.failure{color:var(--red)}
@media(max-width:1050px){.wrap{padding:48px 26px 90px}.stats{grid-template-columns:repeat(3,1fr)}.attention,.body{grid-template-columns:1fr}.flow,.progress{grid-template-columns:1fr 1fr}.company summary{grid-template-columns:1.5fr 1fr 1fr}.company summary>b{grid-column:1/-1;justify-self:start}}
@media(max-width:720px){
.incident-center{display:block}
.incident-icon{margin-bottom:12px}
.incident-item{padding-right:13px}
.incident-item code{position:static;display:block;margin-top:8px}
.operations-head{display:block}
.operations-head button{width:100%;margin-top:14px}
.health-cards{grid-template-columns:1fr}
.health-footer{grid-template-columns:1fr}
.activity-groups{grid-template-columns:1fr}
.health-event{display:block}
.health-event time{display:block;margin-top:4px}
