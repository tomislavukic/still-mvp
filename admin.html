<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Still? Merchant Review Center</title><style>html,body{margin:0;min-height:100%;background:#07100c;color:#eef5f1;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;padding:5vw;box-sizing:border-box}section{max-width:1100px;margin:auto}span{color:#53db91;font-size:11px;font-weight:800;letter-spacing:.08em}h1{font-size:46px;letter-spacing:-2px;margin:8px 0 10px}p,small{color:#9eaaa4;line-height:1.6}form{display:grid;gap:8px;max-width:640px;margin-top:24px}input,textarea{box-sizing:border-box;width:100%;padding:13px;background:#101a15;border:1px solid #263b31;border-radius:10px;color:#fff}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{padding:18px;border:1px solid #263b31;border-radius:16px;background:#0b1510}.card h3{margin:5px 0}.meta{font-size:11px;color:#9eaaa4;line-height:1.6;word-break:break-word}.actions{margin-top:12px}.actions textarea{min-height:70px}.actions div{display:flex;gap:7px;flex-wrap:wrap}.approve{background:#53db91}.change{background:#f2d67a}.reject{background:#ef9b9b}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><main><section><span>STILL? OPERATIONS</span><h1>Merchant Review Center</h1><p>Internal review surface for company verification and retailer-profile claims.</p><form id="auth"><input id="token" type="password" autocomplete="off" placeholder="Verification admin token" required><button>Open review center</button></form><small id="msg"></small><div id="body"></div></section></main><script>(()=>{const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,token,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json','authorization':`Bearer ${token}`}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}async function load(token){const m=$('#msg'),b=$('#body');m.textContent='Loading…';try{const [v,c]=await Promise.all([req('/api/v1/admin/verifications',token),req('/api/v1/admin/retailer-claims',token)]);m.textContent='';b.innerHTML=`<h2>Company verification</h2><div class="grid">${v.requests.length?v.requests.map(x=>card('verification',x)).join(''):'<p>No verification requests.</p>'}</div><h2>Retailer profile claims</h2><div class="grid">${c.claims.length?c.claims.map(x=>card('claim',x)).join(''):'<p>No retailer claims.</p>'}</div>`;b.querySelectorAll('[data-review]').forEach(btn=>btn.onclick=async()=>{const box=btn.closest('.card'),note=box.querySelector('textarea').value,kind=btn.dataset.kind,id=btn.dataset.id,decision=btn.dataset.review,path=kind==='verification'?`/api/v1/admin/verifications/${encodeURIComponent(id)}/review`:`/api/v1/admin/retailer-claims/${encodeURIComponent(id)}/review`;btn.disabled=true;try{await req(path,token,{method:'POST',body:JSON.stringify({decision,note})});await load(token)}catch(e){alert(e.message);btn.disabled=false}})}catch(e){m.textContent=e.message==='admin_not_configured'?'VERIFICATION_ADMIN_TOKEN is not configured in Cloudflare.':e.message==='unauthorized'?'Invalid admin token.':`Could not load review center: ${e.message}`}}function card(kind,x){const id=x.id,name=x.organization_name||x.legal_name||'Company',details=kind==='verification'?`${esc(x.legal_name||'')}<br>${esc(x.registration_number||x.vat_id||'')}<br>${esc(x.website_url||'')}<br>${esc(x.support_email||'')}`:`${esc(x.retailer_name||'')}<br>${esc(x.retailer_key||'')}<br>${esc(x.official_url||'')}`;return `<article class="card"><span>${esc((x.status||'').toUpperCase())}</span><h3>${esc(name)}</h3><div class="meta">${details}</div>${x.evidence_note?`<p>${esc(x.evidence_note)}</p>`:''}<div class="actions"><textarea placeholder="Reviewer note">${esc(x.review_note||'')}</textarea><div><button class="approve" data-review="approved" data-kind="${kind}" data-id="${esc(id)}">Approve</button><button class="change" data-review="needs_changes" data-kind="${kind}" data-id="${esc(id)}">Needs changes</button><button class="reject" data-review="rejected" data-kind="${kind}" data-id="${esc(id)}">Reject</button></div></div></article>`}$('#auth').onsubmit=e=>{e.preventDefault();load($('#token').value)}})();</script></body></html>
