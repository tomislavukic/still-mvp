nd:rgba(8,21,15,.92);border-radius:20px}.stat{padding:20px;cursor:pointer;min-height:112px}.stat:hover{border-color:var(--line2)}.stat b{display:block;font-size:36px;line-height:1}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:10px}.workflow{margin:16px 0 24px;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(14,39,25,.88),rgba(7,19,13,.92))}.workflow-head{display:flex;justify-content:space-between;gap:24px;align-items:center}.workflow h3{margin:0 0 4px;font-size:21px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.flow-step{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(4,16,11,.62);min-height:88px}.flow-step b{display:block;font-size:14px}.flow-step span{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:5px}.flow-step.active{border-color:var(--green);box-shadow:inset 0 0 0 1px rgba(84,220,145,.12)}.attention{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin:0 0 20px}.next-card{padding:21px}.next-card h3{margin:5px 0 7px;font-size:20px}.filters{display:flex;gap:12px;margin:18px 0}.filters input{flex:1}.company{margin:14px 0;overflow:hidden}.company summary{list-style:none;display:grid;grid-template-columns:1.7fr .95fr .95fr auto;gap:16px;align-items:center;padding:22px;cursor:pointer}.company summary::-webkit-details-marker{display:none}.company summary:hover{background:rgba(255,255,255,.02)}.company h3{margin:0 0 6px;font-size:21px}.small{font-size:13px;color:var(--muted);line-height:1.5}.pill{display:inline-flex;padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;line-height:1.1}.pill.approved,.pill.verified{color:var(--green)}.pill.rejected{color:var(--red)}.pill.submitted,.pill.under_review{color:var(--amber)}.body{border-top:1px solid var(--line);padding:20px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.panel{padding:20px}
