<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Still? Merchant Operations</title><style>:root{color-scheme:dark;--bg:#04100b;--card:#08150f;--card2:#0c1b13;--card3:#102419;--line:#244b36;--line2:#34704d;--ink:#f4faf6;--muted:#b1c1b8;--green:#63e69b;--amber:#f4d57a;--red:#ff918a}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(circle at 15% 0,#103421 0,transparent 36%),linear-gradient(#04100b,#020906);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:64px 40px 110px}header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:850}h1{font-size:clamp(42px,4vw,58px);line-height:1.02;letter-spacing:-2.6px;margin:10px 0 12px}h2{font-size:26px}h3{font-size:19px}h2,h3{letter-spacing:-.35px}p{color:var(--muted);line-height:1.65;margin:8px 0}.auth{display:flex;gap:10px;align-items:center}.auth input,.filters input,.filters select,textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 15px;font:inherit;min-height:48px}.auth input{min-width:300px}.auth.logged input{display:none}.auth.logged #open{display:none}.auth #lock{display:none}.auth.logged #lock{display:block}.auth-state{font-size:13px;color:var(--green);display:none}.auth.logged .auth-state{display:block}button{border:0;border-radius:12px;padding:14px 18px;min-height:48px;font:inherit;font-weight:800;cursor:pointer;background:var(--ink);color:#07110c;transition:transform .15s ease,opacity .15s ease}button:hover{transform:translateY(-1px)}.overview{margin-top:34px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.stat,.panel,.company,.next-card{border:1px solid var(--line);background:rgba(8,21,15,.92);border-radius:20px}.stat{padding:20px;cursor:pointer;min-height:112px}.stat:hover{border-color:var(--line2)}.stat b{display:block;font-size:36px;line-height:1}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:10px}.workflow{margin:16px 0 24px;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(14,39,25,.88),rgba(7,19,13,.92))}.workflow-head{display:flex;justify-content:space-between;gap:24px;align-items:center}.workflow h3{margin:0 0 4px;font-size:21px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.flow-step{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(4,16,11,.62);min-height:88px}.flow-step b{display:block;font-size:14px}.flow-step span{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:5px}.flow-step.active{border-color:var(--green);box-shadow:inset 0 0 0 1px rgba(84,220,145,.12)}.attention{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin:0 0 20px}.next-card{padding:21px}.next-card h3{margin:5px 0 7px;font-size:20px}.filters{display:flex;gap:12px;margin:18px 0}.filters input{flex:1}.company{margin:14px 0;overflow:hidden}.company summary{list-style:none;display:grid;grid-template-columns:1.7fr .95fr .95fr auto;gap:16px;align-items:center;padding:22px;cursor:pointer}.company summary::-webkit-details-marker{display:none}.company summary:hover{background:rgba(255,255,255,.02)}.company h3{margin:0 0 6px;font-size:21px}.small{font-size:13px;color:var(--muted);line-height:1.5}.pill{display:inline-flex;padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;line-height:1.1}.pill.approved,.pill.verified{color:var(--green)}.pill.rejected{color:var(--red)}.pill.submitted,.pill.under_review{color:var(--amber)}.body{border-top:1px solid var(--line);padding:20px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.panel{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:14px;background:var(--card2);border-radius:12px;min-height:74px;word-break:break-word}.field span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}.progress div{padding:12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);min-height:74px}.progress div.done{border-color:rgba(84,220,145,.45)}.progress div.current{border-color:var(--green);background:var(--card3)}.progress b{display:block;font-size:12px}.progress span{font-size:11px;color:var(--muted)}.notice{padding:15px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin:14px 0}.notice strong{display:block;margin-bottom:5px;font-size:15px}.review textarea{width:100%;min-height:110px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.approve{background:var(--green)}.changes{background:var(--amber)}.reject{background:var(--red)}.timeline{max-height:360px;overflow:auto}.event{padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:15px}.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:8px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}.section-title h2{margin:0}.count{font-size:13px;color:var(--muted)}@media(max-width:1050px){.wrap{padding:48px 26px 90px}.stats{grid-template-columns:repeat(3,1fr)}.attention,.body{grid-template-columns:1fr}.flow,.progress{grid-template-columns:1fr 1fr}.company summary{grid-template-columns:1.5fr 1fr 1fr}.company summary>b{grid-column:1/-1;justify-self:start}}@media(max-width:720px){body{font-size:17px}.wrap{padding:26px 14px 64px}header{display:block}.eyebrow{font-size:11px}h1{font-size:38px;letter-spacing:-1.8px}.auth{display:grid;grid-template-columns:1fr;margin-top:22px}.auth input{min-width:0;width:100%}.auth button{width:100%}.auth.logged{grid-template-columns:1fr auto}.auth.logged #lock{width:auto}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{min-height:96px;padding:16px}.stat b{font-size:31px}.workflow{padding:16px}.workflow-head{display:block}.flow,.progress{grid-template-columns:1fr}.flow-step,.progress div{min-height:0}.attention{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:1fr}.filters>*{width:100%}.company{border-radius:16px}.company summary{grid-template-columns:1fr;padding:17px;gap:10px}.company summary>b{font-size:14px}.body{padding:12px;grid-template-columns:1fr}.panel{padding:15px}.grid{grid-template-columns:1fr}.field{min-height:0}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%;min-height:52px}.pill{font-size:12px;padding:7px 10px}.small{font-size:13px}.section-title{align-items:flex-end}.next-card{padding:17px}.timeline{max-height:none}textarea{font-size:16px}}@media(max-width:390px){.stats{grid-template-columns:1fr}.wrap{padding-left:12px;padding-right:12px}h1{font-size:34px}}</style></head><body><main class="wrap"><header><div><div class="eyebrow">STILL? OPERATIONS</div><h1>Merchant Review Center</h1><p>One place to move a company from registration to verified buyer routing.</p></div><div class="auth" id="auth"><span class="auth-state">● Secure session active</span><input id="token" type="password" placeholder="Verification admin token" autocomplete="current-password"><button id="open">Open review center</button><button id="lock">Lock admin</button></div></header><section id="app"><div class="empty"><strong>Admin workspace is locked</strong>Enter the verification admin token to load merchant operations.</div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token='',data=null,currentQ='',currentStatus='';async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+token,...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{data:j,status:r.status});return j}const labels={awaiting_submission:'Waiting for merchant',submitted:'Submitted',under_review:'Ready for review',needs_changes:'Changes requested',approved:'Verified',rejected:'Rejected'};const pill=s=>`<span class="pill ${esc(s||'')}">${esc(labels[s]||s||'Waiting for merchant')}</span>`;function stage(o){if(o.claim_status==='approved')return 4;if(o.organization_status==='verified')return 3;if(o.verification_status==='approved')return 3;if(['submitted','under_review','needs_changes','rejected'].includes(o.verification_status))return 2;return 1}function stageBar(o){const n=stage(o),items=[['1','Registered'],['2','Company verification'],['3','Retailer profile'],['4','Buyer routing']];return `<div class="progress">${items.map((x,i)=>`<div class="${i+1<n?'done':i+1===n?'current':''}"><b>${x[1]}</b><span>${i+1<n?'Complete':i+1===n?'Current step':'Next'}</span></div>`).join('')}</div>`}function nextAction(o){if(!o.verification_id)return ['Waiting for merchant','The company account exists, but no verification details have been submitted yet. No admin action is required.'];if(o.verification_status==='under_review'||o.verification_status==='submitted')return ['Review company identity','Check legal identity, VAT/registration details, website and company email before deciding.'];if(o.verification_status==='needs_changes')return ['Waiting for corrections','The merchant must update and resubmit the verification details.'];if(o.verification_status==='rejected')return ['Verification rejected','No routing will activate unless the merchant submits a new acceptable verification request.'];if(o.organization_status==='verified'&&!o.claim_id)return ['Company verified','Next, the merchant must claim the retailer profile buyers actually select.'];if(o.claim_status==='under_review')return ['Review retailer ownership','Confirm this verified company controls the selected retailer identity before approving.'];if(o.claim_status==='approved')return ['Routing ready','Company and retailer identity are approved. Buyer cases can be routed to this merchant.'];return ['Verification complete','Continue with retailer identity claiming.']}function stats(s){const cards=[['',s.organizations||0,'Companies'],['pending',s.verification_pending||0,'Ready for review'],['needs_changes',s.needs_changes||0,'Needs changes'],['claim_review',s.claim_pending||0,'Retailer claims'],['verified',s.verified||0,'Verified']];return `<div class="stats">${cards.map(c=>`<div class="stat" data-filter="${c[0]}"><b>${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div>`}function company(o){const vs=o.verification_status||'awaiting_submission',next=nextAction(o);return `<details class="company" data-org="${esc(o.id)}"><summary><div><h3>${esc(o.name)}</h3><div class="small">${esc(o.owner_email||'No owner email')} · ${esc((o.country_code||'').toUpperCase())} · Registered ${new Date(o.created_at).toLocaleDateString()}</div></div><div>${pill(vs)}</div><div>${o.claim_id?pill(o.claim_status):'<span class="small">Retailer profile not claimed</span>'}</div><b>Open →</b></summary><div class="body"><div><section class="panel">${stageBar(o)}<div class="notice"><strong>${esc(next[0])}</strong><span class="small">${esc(next[1])}</span></div><h3>Company verification</h3><div class="grid"><div class="field"><span>Legal name</span>${esc(o.legal_name||'Not submitted')}</div><div class="field"><span>Registration number</span>${esc(o.registration_number||'—')}</div><div class="field"><span>VAT / tax ID</span>${esc(o.vat_id||'—')}</div><div class="field"><span>Website</span>${esc(o.verification_website||o.website_url||'—')}</div><div class="field"><span>Support email</span>${esc(o.verification_email||o.support_email||'—')}</div><div class="field"><span>Domain evidence</span>${esc(o.website_domain||'—')} / ${esc(o.email_domain||'—')}</div></div>${o.verification_review_note?`<p><b>Previous reviewer note:</b> ${esc(o.verification_review_note)}</p>`:''}${o.verification_id&&['submitted','under_review'].includes(o.verification_status)?`<div class="review"><textarea id="note-v-${esc(o.verification_id)}" placeholder="Reviewer note. Required when requesting changes or rejecting."></textarea><div class="actions"><button class="approve" onclick="reviewVerification('${esc(o.verification_id)}','approved')">Approve company</button><button class="changes" onclick="reviewVerification('${esc(o.verification_id)}','needs_changes')">Request changes</button><button class="reject" onclick="reviewVerification('${esc(o.verification_id)}','rejected')">Reject</button></div></div>`:''}${!o.verification_id?'<p class="small">No verification submission yet. This is expected until the merchant completes the Verification Center in their workspace.</p>':''}</section>${o.claim_id?`<section class="panel" style="margin-top:14px"><h3>Retailer profile claim</h3><div class="grid"><div class="field"><span>Retailer</span>${esc(o.retailer_name)}</div><div class="field"><span>Retailer key</span>${esc(o.claimed_retailer_key)}</div><div class="field"><span>Official URL</span>${esc(o.claim_official_url||'—')}</div><div class="field"><span>Status</span>${pill(o.claim_status)}</div></div>${o.claim_status==='under_review'?`<div class="review"><textarea id="note-c-${esc(o.claim_id)}" placeholder="Reviewer note"></textarea><div class="actions"><button class="approve" onclick="reviewClaim('${esc(o.claim_id)}','approved')">Approve retailer claim</button><button class="changes" onclick="reviewClaim('${esc(o.claim_id)}','needs_changes')">Request changes</button><button class="reject" onclick="reviewClaim('${esc(o.claim_id)}','rejected')">Reject</button></div></div>`:''}</section>`:''}</div><aside class="panel"><h3>Audit history</h3><p class="small">Every admin decision is recorded here.</p><div class="timeline" id="events-${esc(o.id)}"><span class="small">Loading history when opened…</span></div></aside></div></details>`}function attention(){const waiting=data.organizations.filter(o=>!o.verification_id).length,review=data.stats.verification_pending||0,claims=data.stats.claim_pending||0;let title='Nothing needs admin attention right now',body='Registered companies remain visible while merchants complete their own verification forms.';if(review){title=`${review} company ${review===1?'is':'are'} ready for verification review`;body='Review legal identity and domain evidence before approving access to retailer claiming.'}else if(claims){title=`${claims} retailer ${claims===1?'claim is':'claims are'} waiting`;body='Verify retailer ownership before buyer routing is connected.'}return `<div class="attention"><div class="next-card"><div class="eyebrow">NEXT ADMIN ACTION</div><h3>${title}</h3><p>${body}</p></div><div class="next-card"><div class="eyebrow">WAITING ON MERCHANTS</div><h3>${waiting}</h3><p>${waiting===1?'1 registered company still needs to submit verification.':`${waiting} registered companies still need to submit verification.`}</p></div></div>`}function workflow(){return `<div class="workflow"><div class="workflow-head"><div><div class="eyebrow">MERCHANT LIFECYCLE</div><h3>From signup to live buyer routing</h3></div><span class="small">Admin only intervenes at review checkpoints.</span></div><div class="flow"><div class="flow-step active"><b>1 · Registration</b><span>Merchant creates company workspace</span></div><div class="flow-step"><b>2 · Verification</b><span>Admin validates legal identity</span></div><div class="flow-step"><b>3 · Retailer claim</b><span>Admin confirms retailer ownership</span></div><div class="flow-step"><b>4 · Routing</b><span>Buyer cases reach the merchant</span></div></div></div>`}function render(){const a=$('#app');a.innerHTML=`<div class="overview">${stats(data.stats)}${workflow()}${attention()}<div class="section-title"><h2>Companies</h2><span class="count">${data.organizations.length} shown</span></div><div class="filters"><input id="q" value="${esc(currentQ)}" placeholder="Search company, owner email, VAT, registration or retailer…"><select id="status"><option value="">All companies</option><option value="pending">Ready for review</option><option value="awaiting_submission">Waiting for merchant</option><option value="needs_changes">Needs changes</option><option value="verified">Verified</option><option value="rejected">Rejected</option><option value="claim_review">Retailer claim review</option></select></div><div>${data.organizations.length?data.organizations.map(company).join(''):'<div class="empty"><strong>No companies match this view</strong>Try another filter or search term.</div>'}</div></div>`;$('#status').value=currentStatus;$('#q').oninput=debounce(()=>{currentQ=$('#q').value;load()},250);$('#status').onchange=()=>{currentStatus=$('#status').value;load()};document.querySelectorAll('.stat').forEach(c=>c.onclick=()=>{currentStatus=c.dataset.filter;load()});document.querySelectorAll('details.company').forEach(d=>d.ontoggle=()=>{if(d.open)events(d.dataset.org)})}async function load(){try{data=await api('/api/v1/admin/overview?q='+encodeURIComponent(currentQ)+'&status='+encodeURIComponent(currentStatus));$('#auth').classList.add('logged');render()}catch(e){$('#auth').classList.remove('logged');$('#app').innerHTML=`<div class="empty"><strong>${e.status===401?'Admin access denied':'Could not load merchant operations'}</strong>${e.status===401?'The token does not match the runtime verification secret.':e.data?.error==='admin_not_configured'?'VERIFICATION_ADMIN_TOKEN is not configured at runtime.':esc(e.message)}</div>`}}async function events(org){try{const r=await api('/api/v1/admin/organizations/'+encodeURIComponent(org)+'/events'),h=document.getElementById('events-'+org);h.innerHTML=r.events.length?r.events.map(e=>`<div class="event"><b>${esc(e.event_type.replaceAll('_',' '))}</b><div class="small">${esc(e.from_status||'—')} → ${esc(e.to_status||'—')} · ${new Date(e.created_at).toLocaleString()}</div>${e.review_note?`<p>${esc(e.review_note)}</p>`:''}</div>`).join(''):'<div class="empty" style="padding:22px 8px"><strong>No admin decisions yet</strong>The audit trail begins when verification or retailer ownership is reviewed.</div>'}catch{}}async function reviewVerification(id,decision){const note=document.getElementById('note-v-'+id).value.trim();if(decision!=='approved'&&!note)return alert('Add a reviewer note before requesting changes or rejecting.');if(!confirm(`Confirm ${decision.replaceAll('_',' ')}?`))return;try{await api('/api/v1/admin/verifications/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({decision,note})});await load()}catch(e){alert('Review failed: '+(e.data?.error||e.message))}}async function reviewClaim(id,decision){const note=document.getElementById('note-c-'+id).value.trim();if(decision!=='approved'&&!note)return alert('Add a reviewer note before requesting changes or rejecting.');if(!confirm(`Confirm ${decision.replaceAll('_',' ')}?`))return;try{await api('/api/v1/admin/retailer-claims/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({decision,note})});await load()}catch(e){alert(e.data?.error==='retailer_already_claimed'?'That retailer is already owned by another company.':e.data?.error==='company_not_verified'?'Verify the company before approving its retailer claim.':'Claim review failed: '+(e.data?.error||e.message))}}function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}$('#open').onclick=()=>{token=$('#token').value.trim();currentQ='';currentStatus='';load()};$('#lock').onclick=()=>{token='';data=null;$('#token').value='';$('#auth').classList.remove('logged');$('#app').innerHTML='<div class="empty"><strong>Admin workspace locked</strong>Enter the verification admin token to load merchant operations.</div>'};$('#token').onkeydown=e=>{if(e.key==='Enter')$('#open').click()};</script></body></html>
